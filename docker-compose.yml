  #     - mongodb_data:/data/db
  #   environment:
  #     MONGO_INITDB_DATABASE: bookmanager
  #   networks:
  #     - bookmanager-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmanager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # depends_on:
    #   - mongodb
    environment:
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 7d
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - bookmanager-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmanager-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - bookmanager-network

  # mongo-express:
  #   image: mongo-express:1
