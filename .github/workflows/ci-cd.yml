name: CI/CD Pipeline — Azure DevOps
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write
  id-token: write   # Required for OIDC authentication to Azure (passwordless login)

# ─── Global Environment Variables ────────────────────────────
env:
  # Docker Hub (public mirror)
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  # Azure Container Registry (primary, used for deployment)
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_NAME: ${{ secrets.ACR_NAME }}

  # Image names
  FRONTEND_IMAGE: bookmanager-frontend
  BACKEND_IMAGE: bookmanager-backend

  # Tag format: v<run_number> for traceability (e.g. v42)
  IMAGE_TAG: v${{ github.run_number }}

  # Azure deployment
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  VMSS_NAME: ${{ secrets.VMSS_NAME }}

# =====================================================
# JOB 1: CODE QUALITY
# Runs on every push and pull request.
# Checks code style and linting rules.
# =====================================================
jobs:
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for SonarCloud

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Lint Backend
        working-directory: backend
        run: npm run lint --if-present

      # SonarCloud analysis (uncomment when SONAR_TOKEN secret is set)
      # - name: SonarCloud Analysis
      #   uses: SonarSource/sonarqube-scan-action@v5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =====================================================
# JOB 2: TESTS
# Runs after quality checks pass.
# =====================================================
  tests:
    name: 🧪 Automated Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend && npm ci
          cd ../backend && npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test --if-present || echo "⚠ No test script, skipping."

      - name: Run Backend Tests
        working-directory: backend
        run: npm run test --if-present || echo "⚠ No test script, skipping."

# =====================================================
# JOB 3: BUILD
# Compiles the application (verifies there are no
# TypeScript errors or build failures).
# =====================================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build Frontend (React + Vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          echo "Frontend build size: $(du -sh dist/)"

      - name: Build Backend (NestJS)
        working-directory: backend
        run: |
          npm ci
          npm run build
          echo "Backend build size: $(du -sh dist/)"

# =====================================================
# JOB 4: DOCKER BUILD + SECURITY SCAN + PUSH
# Builds Docker images, scans with Trivy, then pushes
# to BOTH Docker Hub (public mirror) and ACR (private,
# used for deployment to Azure).
#
# Runs only on push events (not PRs) to avoid
# pushing untested code from forks.
# =====================================================
  docker:
    name: 🐳 Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # ─── Set up Docker Buildx ────────────────────────────
      # Buildx enables multi-platform builds and better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── Login to Docker Hub (public mirror) ─────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─── Login to Azure Container Registry ───────────────
      # Uses OIDC (OpenID Connect) – no password stored in secrets!
      # The id-token: write permission at the top enables this.
      - name: Azure Login (OIDC – passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      # ─── Build Frontend Image ─────────────────────────────
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true   # Load into local Docker (needed for Trivy scan)
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Build Backend Image ──────────────────────────────
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Security Scanning with Trivy ─────────────────────
      # Trivy scans for known CVEs in:
      #   - OS packages (Alpine, Ubuntu, etc.)
      #   - Node.js dependencies (npm)
      #   - Dockerfile misconfigurations

      - name: Trivy – Scan Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 0   # Don't fail on findings (report only)

      - name: Upload FS Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Trivy – Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Frontend Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image

      - name: Trivy – Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Backend Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

      # ─── Push Images ──────────────────────────────────────
      # Push to BOTH registries simultaneously

      - name: Push Frontend → Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push Backend → Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push Frontend → Azure Container Registry
        run: docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push Backend → Azure Container Registry
        run: docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # Tag as 'latest' in ACR for reference
      - name: Tag as latest in ACR
        run: |
          az acr import \
            --name ${{ env.ACR_NAME }} \
            --source ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            --image ${{ env.BACKEND_IMAGE }}:latest \
            --force
          az acr import \
            --name ${{ env.ACR_NAME }} \
            --source ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            --image ${{ env.FRONTEND_IMAGE }}:latest \
            --force

# =====================================================
# JOB 5: DEPLOY TO AZURE
# Runs only on push to main branch.
# Uses az vmss run-command to update each VMSS instance
# without needing SSH access.
# =====================================================
  deploy:
    name: 🚀 Deploy to Azure (VMSS)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://${{ secrets.APP_GATEWAY_PUBLIC_IP }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ─── Get list of VMSS instances ───────────────────────
      - name: Get VMSS instance IDs
        id: vmss_instances
        run: |
          INSTANCES=$(az vmss list-instances \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.VMSS_NAME }} \
            --query "[].instanceId" \
            --output tsv)
          echo "instances=$INSTANCES" >> $GITHUB_OUTPUT
          echo "Found instances: $INSTANCES"

      # ─── Rolling deploy via az vmss run-command ───────────
      # This executes a shell script on each VM remotely.
      # No SSH key or bastion needed for automation.
      - name: Deploy to VMSS instances (rolling)
        run: |
          ACR="${{ env.ACR_LOGIN_SERVER }}"
          TAG="${{ env.IMAGE_TAG }}"
          ACR_NAME="${{ env.ACR_NAME }}"

          for INSTANCE_ID in ${{ steps.vmss_instances.outputs.instances }}; do
            echo "=== Deploying to instance $INSTANCE_ID ==="

            RESULT=$(az vmss run-command invoke \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.VMSS_NAME }} \
              --command-id RunShellScript \
              --instance-id "$INSTANCE_ID" \
              --scripts "
                set -e
                cd /opt/bookmanager

                # Re-authenticate to ACR using Managed Identity
                az login --identity --output none
                az acr login --name $ACR_NAME

                # Update image tags in docker-compose.yml
                sed -i \"s|${ACR}/bookmanager-backend:.*|${ACR}/bookmanager-backend:${TAG}|g\" docker-compose.yml
                sed -i \"s|${ACR}/bookmanager-frontend:.*|${ACR}/bookmanager-frontend:${TAG}|g\" docker-compose.yml

                # Pull new images
                docker compose pull

                # Restart backend first, wait, then frontend
                docker compose up -d --force-recreate --no-deps backend
                sleep 15

                # Health check
                curl -sf http://localhost:3000/api/health && echo 'BACKEND_OK' || echo 'BACKEND_FAIL'

                docker compose up -d --force-recreate --no-deps frontend
                sleep 5

                # Cleanup old images
                docker image prune -f

                echo 'DEPLOY_COMPLETE'
              " \
              --output json)

            OUTPUT=$(echo "$RESULT" | jq -r '.value[0].message' 2>/dev/null || echo "$RESULT")
            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q "DEPLOY_COMPLETE"; then
              echo "✅ Instance $INSTANCE_ID deployed successfully"
            else
              echo "⚠️  Instance $INSTANCE_ID may have issues — check logs"
            fi

            # Wait between instances for rolling deployment
            sleep 30
          done

      # ─── Verify Deployment ────────────────────────────────
      - name: Verify deployment health
        run: |
          APP_IP="${{ secrets.APP_GATEWAY_PUBLIC_IP }}"
          echo "Testing http://${APP_IP}/health"

          # Wait for Application Gateway health probes to update
          sleep 30

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${APP_IP}/health" || echo "000")

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "✅ Deployment verified — App is healthy at http://${APP_IP}"
          else
            echo "⚠️  Health check returned HTTP $HTTP_CODE"
            echo "Check Azure Monitor and Application Insights for details."
          fi

      # ─── Deployment Summary ───────────────────────────────
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ACR | \`${{ env.ACR_LOGIN_SERVER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VMSS | \`${{ env.VMSS_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| App URL | http://${{ secrets.APP_GATEWAY_PUBLIC_IP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY