name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  FRONTEND_IMAGE: bookmanager-frontend
  BACKEND_IMAGE: bookmanager-backend

jobs:
  build-and-test:
    name: Build, Lint, Test & SonarQube
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for SonarQube

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 2: Install dependencies
      - name: 2. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 2. Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # Step 3: Lint
      - name: 3. Lint Frontend
        working-directory: ./frontend
        run: npm run lint --if-present || echo "No lint script provided"

      - name: 3. Lint Backend
        working-directory: ./backend
        run: npm run lint --if-present || echo "No lint script provided"

      # Step 4: Run tests
      - name: 4. Test Frontend
        working-directory: ./frontend
        run: npm run test --if-present || echo "No test script provided"

      - name: 4. Test Backend
        working-directory: ./backend
        run: npm run test --if-present || echo "No test script provided"

      # Step 5: Build application
      - name: 5. Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: 5. Build Backend
        working-directory: ./backend
        run: npm run build

      # Step 6: SonarQube Scan
      - name: 6. SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' # Only push images on merges to main/develop
    steps:
      # Step 1: Checkout repository
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build Docker images
      - name: 7. Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          load: true

      - name: 7. Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          load: true

      # Step 8: Scan Docker image with Trivy
      - name: 8. Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: 8. Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      # Step 9: Push image to Docker Hub
      - name: 9. Push Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
