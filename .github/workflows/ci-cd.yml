name: CI/CD Pipeline


on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop



env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  FRONTEND_IMAGE: bookmanager-frontend
  BACKEND_IMAGE: bookmanager-backend



# ==================================================
# 1. CODE QUALITY
# ==================================================

jobs:

  quality:

    name: Code Quality & SonarQube

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json



      - name: Install Frontend dependencies

        working-directory: frontend

        run: npm ci



      - name: Install Backend dependencies

        working-directory: backend

        run: npm ci



      - name: Frontend Lint

        working-directory: frontend

        run: npm run lint --if-present



      - name: Backend Lint

        working-directory: backend

        run: npm run lint --if-present



      - name: SonarQube Cloud Analysis

        uses: SonarSource/sonarqube-scan-action@v5

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





# ==================================================
# 2. TESTS
# ==================================================


  tests:


    name: Automated Tests

    runs-on: ubuntu-latest

    needs: quality



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json



      - name: Install Frontend dependencies

        working-directory: frontend

        run: npm ci



      - name: Install Backend dependencies

        working-directory: backend

        run: npm ci



      - name: Frontend Tests

        working-directory: frontend

        run: npm test -- --watchAll=false



      - name: Backend Tests

        working-directory: backend

        run: npm test





# ==================================================
# 3. BUILD APPLICATION
# ==================================================


  build:


    name: Build React & NestJS

    runs-on: ubuntu-latest

    needs: tests



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json



      - name: Build Frontend

        working-directory: frontend

        run: |

          npm ci

          npm run build



      - name: Build Backend

        working-directory: backend

        run: |

          npm ci

          npm run build





# ==================================================
# 4. DOCKER BUILD + SECURITY
# ==================================================


  docker:


    name: Docker Build Scan & Push

    runs-on: ubuntu-latest

    needs: build



    if: github.event_name == 'push'



    steps:



      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Login Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}






      # ------------------------------
      # Build Images
      # ------------------------------


      - name: Build Frontend Image

        uses: docker/build-push-action@v5

        with:

          context: ./frontend

          load: true

          push: false

          tags: |

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest





      - name: Build Backend Image

        uses: docker/build-push-action@v5

        with:

          context: ./backend

          load: true

          push: false

          tags: |

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest






      # ------------------------------
      # Trivy Filesystem Scan
      # ------------------------------


      - name: Trivy Filesystem Scan

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          format: table

          exit-code: 0






      # ------------------------------
      # Trivy Docker Scan
      # ------------------------------


      - name: Scan Frontend Image

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          format: table

          vuln-type: os,library

          exit-code: 0





      - name: Scan Backend Image

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          format: table

          vuln-type: os,library

          exit-code: 0






      # ------------------------------
      # Push Images
      # ------------------------------


      - name: Push Frontend Image

        run: |

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest





      - name: Push Backend Image

        run: |

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest