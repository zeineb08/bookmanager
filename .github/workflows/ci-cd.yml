name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write
  id-token: write  # Required for Azure OIDC login

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  FRONTEND_IMAGE: bookmanager-frontend
  BACKEND_IMAGE: bookmanager-backend
  IMAGE_TAG: v${{ github.run_number }}

# ==================================================
# 1. CODE QUALITY
# ==================================================

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Backend Lint
        working-directory: backend
        run: npm run lint --if-present

      # - name: SonarQube Cloud Analysis
      #   uses: SonarSource/sonarqube-scan-action@v5
      #   with:
      #     args: >
      #       -Dsonar.projectKey=bookmanager
      #       -Dsonar.organization=zeineb08
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ==================================================
# 2. TESTS
# ==================================================
  tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci

      - name: Frontend Tests
        working-directory: frontend
        run: npm run test --if-present || echo "No test script found, skipping."

      - name: Backend Tests
        working-directory: backend
        run: npm run test --if-present || echo "No test script found, skipping."

# ==================================================
# 3. BUILD APPLICATION
# ==================================================
  build:
    name: Build React & NestJS
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      # Upload frontend dist for the deploy job
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

# ==================================================
# 4. DOCKER BUILD + SECURITY SCAN + PUSH (DockerHub + ACR)
# ==================================================
  docker:
    name: Docker Build, Scan & Push (DockerHub + ACR)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Login to both registries ---
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          # creds: ${{ secrets.AZURE_CREDENTIALS }}
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANT_ID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      # ------------------------------
      # Build Images (tagged for both registries)
      # ------------------------------
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # ------------------------------
      # Trivy Filesystem Scan
      # ------------------------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy FS Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      # ------------------------------
      # Trivy Docker Image Scans
      # ------------------------------
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy Frontend Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy Backend Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

      # ------------------------------
      # Push to DockerHub
      # ------------------------------
      - name: Push Frontend Image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push Backend Image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # ------------------------------
      # Push to ACR (production registry)
      # ------------------------------
      - name: Push Frontend Image to ACR
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push Backend Image to ACR
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Tag & Push Backend as latest to ACR
        run: |
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
                     ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest

# ==================================================
# 5. DEPLOY TO AZURE
# ==================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Azure Login ---
      - name: Login to Azure
        uses: azure/login@v2
        with:
          # creds: ${{ secrets.AZURE_CREDENTIALS }}
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANT_ID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTION_ID }}

      # --- Deploy Backend: Update Container App with new image ---
      - name: Deploy Backend to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # --- Deploy Frontend: Upload static files to Blob Storage ---
      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Deploy Frontend to Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name ${{ secrets.STORAGE_ACCOUNT_NAME }} \
            --destination '$web' \
            --source frontend/dist/ \
            --overwrite true

      # --- Verify Deployment ---
      - name: Verify Backend Health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          BACKEND_URL=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Backend URL: https://$BACKEND_URL"
          curl -sf "https://$BACKEND_URL/api" || echo "Warning: Health check returned non-200"

      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "  DEPLOYMENT COMPLETE"
          echo "========================================="
          echo ""
          echo "Backend:  Updated to image tag ${{ env.IMAGE_TAG }}"
          echo "Frontend: Uploaded to Blob Storage static website"
          echo ""
          echo "========================================="