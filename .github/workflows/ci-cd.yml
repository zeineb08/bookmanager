name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  FRONTEND_IMAGE: bookmanager-frontend
  BACKEND_IMAGE: bookmanager-backend

# ======================================
# 1. CODE QUALITY
# ======================================

jobs:

  quality:
    name: Code Quality & SonarQube
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci


      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint --if-present


      - name: Backend Lint
        working-directory: backend
        run: npm run lint --if-present


      - name: SonarQube Cloud Analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ======================================
# 2. TESTS
# ======================================

  tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci

      - name: Frontend Tests
        working-directory: frontend
        run: npm test -- --watchAll=false || true

      - name: Backend Tests
        working-directory: backend
        run: npm test || true

# ======================================
# 3. BUILD APPLICATION
# ======================================
  build:

    name: Build Application
    runs-on: ubuntu-latest
    needs: tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - name: Build Frontend

        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Backend

        working-directory: backend

        run: |

          npm ci

          npm run build




# ======================================
# 4. DOCKER BUILD
# ======================================


  docker-build:

    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Build Frontend Docker Image

        uses: docker/build-push-action@v5

        with:

          context: ./frontend

          push: false

          load: true

          tags:

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}




      - name: Build Backend Docker Image

        uses: docker/build-push-action@v5

        with:

          context: ./backend

          push: false

          load: true

          tags:

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}






# ======================================
# 5. SECURITY SCAN
# ======================================


  security:

    name: Trivy Security Scan

    runs-on: ubuntu-latest

    needs: docker-build



    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Trivy Filesystem Scan

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          format: table

          exit-code: 0




      - name: Login Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}




      - name: Scan Frontend Image

        uses: aquasecurity/trivy-action@master

        with:

          image-ref:

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          format: table

          exit-code: 0

          vuln-type: os,library




      - name: Scan Backend Image

        uses: aquasecurity/trivy-action@master

        with:

          image-ref:

            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          format: table

          exit-code: 0

          vuln-type: os,library





# ======================================
# 6. PUSH IMAGES
# ======================================


  push:

    name: Push Images to Docker Hub

    runs-on: ubuntu-latest

    needs: security

    if: github.event_name == 'push'



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Login Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}



      - name: Build and Push Frontend

        uses: docker/build-push-action@v5

        with:

          context: ./frontend

          push: true

          tags:

            |

              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest




      - name: Build and Push Backend

        uses: docker/build-push-action@v5

        with:

          context: ./backend

          push: true

          tags:

            |

              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest